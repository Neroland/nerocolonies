## EMI — optional recipe-viewer compat. Official EMI has no MC 26.x release, so this pins the community
## "EMI Unofficial Port (Unstable)" (CurseForge project 1544558, MIT, upstream dev.emi.emi.api unchanged),
## fetched through CurseMaven by CurseForge FILE id. NeoForge + Fabric only; the Forge cells compile
## against the NeoForge file (API only). Dev clients load EMI only with -PwithEmi.
emi_file_neoforge_26.1.2=8630349
emi_file_neoforge_26.2=8616659
emi_file_neoforge_26.3=8897084
emi_file_fabric_26.1.2=8630346
emi_file_fabric_26.2=8616656
emi_file_fabric_26.3=8897080

## Neroland Core — shared foundation library (required dependency, loads BEFORE NeroColonies).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## mavenLocal() or the NerolandCoreGitHubPackages maven declared in stonecutter.gradle. The manifest
## floor is this pinned version (floor = compiled Core version) so the loader refuses a Core too old
## to have the APIs NeroColonies compiles against (registration seam, machine base, side config,
## config schema, data erasure, offline-capable progression gates, sourced threshold events).
nerolandcore_version=1.17.0

## NeroEconomy — OPTIONAL. compileOnly against its public api package (never bundled, never required);
## resolved from mavenLocal() or the NeroEconomyGitHubPackages maven declared in stonecutter.gradle only
## when credentials are present. Only compat/neroeconomy/NeroEconomyBridge names its classes.
neroeconomy_version=0.5.0-beta.1

## Nerospace - OPTIONAL. compileOnly against its public api package (never bundled, never required); only
## compat/nerospace/ names its classes, found through a META-INF/services seam after isModLoaded("nerospace").
## Resolved as za.co.neroland.nerospace:nerospace-<loader>-<mc>:<this> from mavenLocal() or the Nerospace
## GitHub Packages maven (declared in stonecutter.gradle only when credentials are present).
## nerospace_compat=false excludes the bridge classes and their services line, for a build where the artifact
## does not resolve (every colony is then GENERIC and every dimension breathable). A per-Minecraft-version flag
## (nerospace_compat_<mc>) overrides the global one for that cell only. The manifests keep their unversioned
## optional entry on purpose: a version range there would refuse packs that still run Nerospace 1.x.
nerospace_version=2.0.1
nerospace_compat=true

